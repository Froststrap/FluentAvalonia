name: Release NuGet package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without a leading v"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Select package version
        id: version
        env:
          TAG_VERSION: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${TAG_VERSION#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid package version: $version" >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - run: dotnet restore FluentAvalonia.sln --configfile nuget.config
      - run: dotnet build src/FluentAvalonia/FluentAvalonia.csproj --configuration Release --no-restore
      - run: dotnet test tests/FluentAvaloniaTests/FluentAvaloniaTests.csproj --configuration Release --no-restore
      - run: dotnet pack src/FluentAvalonia/FluentAvalonia.csproj --configuration Release --no-build --output artifacts -p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "artifacts/Froststrap.FluentAvalonia.${{ steps.version.outputs.value }}.nupkg" --source https://nuget.pkg.github.com/Froststrap/index.json --api-key "$NUGET_AUTH_TOKEN" --skip-duplicate
